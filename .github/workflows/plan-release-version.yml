name: Plan release version

run-name: Plan ${{ inputs.operation }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Semantic operation; its validity depends on the selected branch
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - candidate
          - final
  workflow_call:
    inputs:
      application_mode:
        description: Require an exact confirmation and expose mutation-ready outputs
        required: false
        default: false
        type: boolean
      operation:
        description: Semantic operation to resolve
        required: true
        type: string
      confirmed_tag:
        description: Exact canonical tag to confirm; empty means planning only
        required: false
        default: ""
        type: string
      ref_name:
        description: Selected branch name
        required: true
        type: string
      target_sha:
        description: Selected branch SHA at dispatch time
        required: true
        type: string
    outputs:
      application_ready:
        description: Whether the exact current proposal was confirmed
        value: ${{ jobs.resolve.outputs.application_ready }}
      context:
        description: Default-branch or release-branch context
        value: ${{ jobs.resolve.outputs.context }}
      default_branch:
        description: Current repository default branch
        value: ${{ jobs.resolve.outputs.default_branch }}
      kind:
        description: Candidate or final operation kind
        value: ${{ jobs.resolve.outputs.kind }}
      release_branch:
        description: Exact release branch
        value: ${{ jobs.resolve.outputs.release_branch }}
      status:
        description: Resolver status
        value: ${{ jobs.resolve.outputs.status }}
      tag:
        description: Exact canonical tag
        value: ${{ jobs.resolve.outputs.tag }}
      tag_snapshot:
        description: SHA-256 of the sorted remote tag-name set
        value: ${{ jobs.resolve.outputs.tag_snapshot }}
      tag_state:
        description: Whether the resolved tag is absent or an existing final
        value: ${{ jobs.resolve.outputs.tag_state }}

permissions: {}

jobs:
  resolve:
    name: Resolve exact tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      application_ready: ${{ steps.resolve.outputs.application_ready }}
      context: ${{ steps.resolve.outputs.context }}
      default_branch: ${{ steps.resolve.outputs.default_branch }}
      kind: ${{ steps.resolve.outputs.kind }}
      release_branch: ${{ steps.resolve.outputs.release_branch }}
      status: ${{ steps.resolve.outputs.status }}
      tag: ${{ steps.resolve.outputs.tag }}
      tag_snapshot: ${{ steps.resolve.outputs.tag_snapshot }}
      tag_state: ${{ steps.resolve.outputs.tag_state }}
    steps:
      - name: Resolve without checking out source code
        id: resolve
        env:
          APPLICATION_MODE: ${{ inputs.application_mode || false }}
          CONFIRMED_TAG: ${{ inputs.confirmed_tag }}
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          REF_NAME: ${{ inputs.ref_name || github.ref_name }}
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          tags_file="$RUNNER_TEMP/release-tags.txt"
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/" \
            --jq '.[].ref | sub("^refs/tags/"; "")' \
            | LC_ALL=C sort -u > "$tags_file"

          default_branch="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}" \
              --jq .default_branch
          )"
          tag_snapshot="$(sha256sum "$tags_file" | cut -d ' ' -f 1)"

          export DEFAULT_BRANCH="$default_branch"
          export TAGS_FILE="$tags_file"
          export TAG_SNAPSHOT="$tag_snapshot"

          python3 - <<'PYTHON'
          from __future__ import annotations

          import os
          import re
          import sys
          from dataclasses import dataclass
          from pathlib import Path
          from typing import Iterable


          TAG_PATTERN = re.compile(
              r"^(?P<prefix>v?)(?P<major>0|[1-9][0-9]*)\."
              r"(?P<minor>0|[1-9][0-9]*)\."
              r"(?P<patch>0|[1-9][0-9]*)"
              r"(?:-rc\.(?P<rc>[1-9][0-9]*))?$"
          )
          CANONICAL_TAG_PATTERN = re.compile(
              r"^v(?P<major>0|[1-9][0-9]*)\."
              r"(?P<minor>0|[1-9][0-9]*)\."
              r"(?P<patch>0|[1-9][0-9]*)"
              r"(?:-rc\.(?P<rc>[1-9][0-9]*))?$"
          )
          RELEASE_BRANCH_PATTERN = re.compile(
              r"^release/v(?P<major>0|[1-9][0-9]*)\."
              r"(?P<minor>0|[1-9][0-9]*)\."
              r"(?P<patch>0|[1-9][0-9]*)$"
          )
          DEFAULT_OPERATIONS = {"patch", "minor", "major"}
          RELEASE_OPERATIONS = {"candidate", "final"}


          @dataclass(frozen=True)
          class Version:
              major: int
              minor: int
              patch: int
              rc: int | None = None

              @property
              def base(self) -> tuple[int, int, int]:
                  return self.major, self.minor, self.patch

              @property
              def stable(self) -> bool:
                  return self.rc is None

              @property
              def tag(self) -> str:
                  base = f"v{self.major}.{self.minor}.{self.patch}"
                  return base if self.stable else f"{base}-rc.{self.rc}"

              def precedence_key(self) -> tuple[int, int, int, int, int]:
                  return (*self.base, 1 if self.stable else 0, self.rc or 0)


          @dataclass(frozen=True)
          class ParsedTag:
              raw: str
              version: Version
              canonical: bool


          def parse_tag(raw: str) -> ParsedTag | None:
              value = raw.strip()
              match = TAG_PATTERN.fullmatch(value)
              if match is None:
                  return None
              version = Version(
                  major=int(match.group("major")),
                  minor=int(match.group("minor")),
                  patch=int(match.group("patch")),
                  rc=int(match.group("rc")) if match.group("rc") else None,
              )
              return ParsedTag(raw=value, version=version, canonical=value.startswith("v"))


          def parse_tags(raw_tags: Iterable[str]) -> tuple[list[ParsedTag], int]:
              parsed: list[ParsedTag] = []
              ignored = 0
              for raw in raw_tags:
                  tag = parse_tag(raw)
                  if tag is None:
                      ignored += 1
                  else:
                      parsed.append(tag)
              return parsed, ignored


          def base_tag(base: tuple[int, int, int], rc: int | None = None) -> str:
              return Version(*base, rc=rc).tag


          def tags_for_base(
              tags: Iterable[ParsedTag], base: tuple[int, int, int]
          ) -> list[ParsedTag]:
              return [tag for tag in tags if tag.version.base == base]


          def final_for_base(
              tags: Iterable[ParsedTag], base: tuple[int, int, int]
          ) -> ParsedTag | None:
              finals = [tag for tag in tags_for_base(tags, base) if tag.version.stable]
              return max(finals, key=lambda tag: (tag.canonical, tag.raw), default=None)


          def next_rc_for_base(tags: Iterable[ParsedTag], base: tuple[int, int, int]) -> int:
              numbers = [
                  tag.version.rc
                  for tag in tags_for_base(tags, base)
                  if tag.version.rc is not None
              ]
              return max(numbers, default=0) + 1


          def latest_tag(tags: Iterable[ParsedTag]) -> ParsedTag:
              return max(
                  tags,
                  key=lambda tag: (tag.version.precedence_key(), tag.canonical, tag.raw),
              )


          def display(tag: ParsedTag) -> str:
              return tag.version.tag if tag.canonical else tag.raw


          def blocked(
              *,
              status: str,
              reason: str,
              confirmed_tag: str | None,
              context: str = "",
              tag: str = "",
              kind: str = "",
              release_branch: str = "",
              latest: str = "",
              ignored: int = 0,
          ) -> dict[str, object]:
              return {
                  "ok": False,
                  "mode": "apply" if confirmed_tag is not None else "plan",
                  "context": context,
                  "tag": tag,
                  "kind": kind,
                  "release_branch": release_branch,
                  "latest_tag": latest,
                  "ignored_tag_count": ignored,
                  "status": status,
                  "reason": reason,
                  "tag_state": "unknown",
                  "application_ready": False,
              }


          def resolve(
              *,
              ref_name: str,
              default_branch: str,
              operation: str,
              raw_tags: Iterable[str],
              confirmed_tag: str | None,
          ) -> dict[str, object]:
              tags, ignored = parse_tags(raw_tags)
              latest = display(latest_tag(tags)) if tags else ""

              if confirmed_tag is not None and CANONICAL_TAG_PATTERN.fullmatch(confirmed_tag) is None:
                  return blocked(
                      status="blocked-noncanonical",
                      reason="the exact tag must match vX.Y.Z or vX.Y.Z-rc.N",
                      confirmed_tag=confirmed_tag,
                      latest=latest,
                      ignored=ignored,
                  )

              if ref_name == default_branch:
                  context = "default"
                  if operation not in DEFAULT_OPERATIONS:
                      return blocked(
                          status="blocked-context-operation",
                          reason="the default branch accepts only patch, minor, or major",
                          confirmed_tag=confirmed_tag,
                          context=context,
                          latest=latest,
                          ignored=ignored,
                      )
                  if not tags:
                      return blocked(
                          status="blocked-missing-baseline",
                          reason=(
                              "no SemVer baseline exists; initialize it explicitly before "
                              "using this Action"
                          ),
                          confirmed_tag=confirmed_tag,
                          context=context,
                          ignored=ignored,
                      )

                  current = latest_tag(tags)
                  major, minor, patch = current.version.base
                  bases = {
                      "patch": (major, minor, patch + 1),
                      "minor": (major, minor + 1, 0),
                      "major": (major + 1, 0, 0),
                  }
                  base = bases[operation]
                  branch = f"release/{base_tag(base)}"
                  existing = tags_for_base(tags, base)
                  final = final_for_base(tags, base)
                  proposal = base_tag(base, next_rc_for_base(tags, base))

                  if final is not None:
                      return blocked(
                          status="blocked-finalized",
                          reason=f"{final.version.tag} already finalizes the proposed release line",
                          confirmed_tag=confirmed_tag,
                          context=context,
                          kind="candidate",
                          release_branch=branch,
                          latest=latest,
                          ignored=ignored,
                      )
                  if existing:
                      return blocked(
                          status="blocked-release-in-progress",
                          reason=(
                              f"continue the release from {branch}; do not create another "
                              f"candidate from {default_branch}"
                          ),
                          confirmed_tag=confirmed_tag,
                          context=context,
                          tag=proposal,
                          kind="candidate",
                          release_branch=branch,
                          latest=latest,
                          ignored=ignored,
                      )
              else:
                  match = RELEASE_BRANCH_PATTERN.fullmatch(ref_name)
                  if match is None:
                      return blocked(
                          status="blocked-ref",
                          reason=f"select {default_branch} or an exact release/vX.Y.Z branch",
                          confirmed_tag=confirmed_tag,
                          latest=latest,
                          ignored=ignored,
                      )
                  context = "release"
                  if operation not in RELEASE_OPERATIONS:
                      return blocked(
                          status="blocked-context-operation",
                          reason="a release branch accepts only candidate or final",
                          confirmed_tag=confirmed_tag,
                          context=context,
                          release_branch=ref_name,
                          latest=latest,
                          ignored=ignored,
                      )

                  base = (
                      int(match.group("major")),
                      int(match.group("minor")),
                      int(match.group("patch")),
                  )
                  branch = ref_name
                  line_tag = base_tag(base)
                  final = final_for_base(tags, base)
                  proposal = (
                      line_tag
                      if operation == "final"
                      else base_tag(base, next_rc_for_base(tags, base))
                  )

                  if final is not None:
                      has_exact_final = any(
                          tag.raw == line_tag and tag.version.stable for tag in tags
                      )
                      if (
                          confirmed_tag is not None
                          and operation == "final"
                          and confirmed_tag == line_tag
                          and has_exact_final
                      ):
                          return {
                              "ok": True,
                              "mode": "apply",
                              "context": context,
                              "tag": line_tag,
                              "kind": "final",
                              "release_branch": branch,
                              "latest_tag": latest,
                              "ignored_tag_count": ignored,
                              "status": "reconcile-existing-final",
                              "reason": (
                                  "the final tag already exists; verify its commit and "
                                  "reconcile only the PR"
                              ),
                              "tag_state": "existing-final",
                              "application_ready": True,
                          }
                      return blocked(
                          status="blocked-finalized",
                          reason=f"{final.version.tag} already finalizes this release line",
                          confirmed_tag=confirmed_tag,
                          context=context,
                          tag=line_tag if operation == "final" else "",
                          kind="final" if operation == "final" else "candidate",
                          release_branch=branch,
                          latest=latest,
                          ignored=ignored,
                      )

              kind = "final" if operation == "final" else "candidate"
              if confirmed_tag is not None and confirmed_tag != proposal:
                  return blocked(
                      status="blocked-confirmation-mismatch",
                      reason="the confirmed tag does not match the current exact proposal",
                      confirmed_tag=confirmed_tag,
                      context=context,
                      tag=proposal,
                      kind=kind,
                      release_branch=branch,
                      latest=latest,
                      ignored=ignored,
                  )

              return {
                  "ok": True,
                  "mode": "apply" if confirmed_tag is not None else "plan",
                  "context": context,
                  "tag": proposal,
                  "kind": kind,
                  "release_branch": branch,
                  "latest_tag": latest,
                  "ignored_tag_count": ignored,
                  "status": "application-ready" if confirmed_tag is not None else "proposal-ready",
                  "reason": "",
                  "tag_state": "absent",
                  "application_ready": confirmed_tag is not None,
              }


          ref_name = os.environ["REF_NAME"]
          default_branch = os.environ["DEFAULT_BRANCH"]
          operation = os.environ["OPERATION"]
          application_mode = os.environ["APPLICATION_MODE"] == "true"
          confirmed_tag = os.environ.get("CONFIRMED_TAG") if application_mode else None
          raw_tags = [
              line
              for line in Path(os.environ["TAGS_FILE"]).read_text(encoding="utf-8").splitlines()
              if line
          ]
          result = resolve(
              ref_name=ref_name,
              default_branch=default_branch,
              operation=operation,
              raw_tags=raw_tags,
              confirmed_tag=confirmed_tag,
          )
          result["default_branch"] = default_branch
          result["tag_snapshot"] = os.environ["TAG_SNAPSHOT"]

          output_keys = (
              "application_ready",
              "context",
              "default_branch",
              "kind",
              "release_branch",
              "status",
              "tag",
              "tag_snapshot",
              "tag_state",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for key in output_keys:
                  value = result.get(key, "")
                  rendered = str(value).lower() if isinstance(value, bool) else str(value)
                  output.write(f"{key}={rendered}\n")

          rows = (
              ("Mode", result["mode"]),
              ("Selected ref", ref_name),
              ("Selected commit", os.environ["TARGET_SHA"]),
              ("Operation", operation),
              ("Latest SemVer tag", result["latest_tag"] or "none"),
              ("Resolved tag", result["tag"] or "blocked"),
              ("Release branch", result["release_branch"] or "n/a"),
              ("Status", result["status"]),
          )

          def markdown_value(value: object) -> str:
              return str(value).replace("\n", " ").replace("|", "\\|").replace("`", "\\`")

          lines = ["## Release version resolution", "", "| Field | Value |", "| --- | --- |"]
          lines.extend(f"| {label} | `{markdown_value(value)}` |" for label, value in rows)
          lines.extend(
              [
                  "",
                  "This workflow does not check out source code, read package metadata, "
                  "edit files, or create commits.",
              ]
          )
          if result["reason"]:
              lines.extend(["", f"**Blocked:** {markdown_value(result['reason'])}"])
          elif result["mode"] == "plan":
              lines.extend(
                  [
                      "",
                      "Run **Apply release version** from the same ref and enter the exact "
                      "resolved tag to confirm it.",
                  ]
              )
          elif result["tag_state"] == "existing-final":
              lines.extend(
                  [
                      "",
                      "The tag will not be recreated or moved; only final PR reconciliation "
                      "may continue.",
                  ]
              )
          else:
              lines.extend(["", "The exact confirmation matches the current proposal."])

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")

          print(f"status={result['status']} tag={result['tag'] or 'blocked'}")
          sys.exit(0 if result["ok"] else 2)
          PYTHON
